[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent1"
version = "0.1.16"
description = "A simple LLM abstraction layer"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

authors = [
  { name = "vincentdeneuf", email = "0189vn@gmail.com" },
]

dependencies = [
  "litellm>=1.81.12",
  "pydantic>=2.0.0",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

keywords = ["llm", "ai", "abstraction", "openai", "anthropic"]

[project.urls]
Homepage = "https://github.com/vincentdeneuf/agent1"
Repository = "https://github.com/vincentdeneuf/agent1"
Issues = "https://github.com/vincentdeneuf/agent1/issues"

[dependency-groups]
dev = [
  "ruff>=0.2",
  "pytest>=8",
  "build>=1",
  "twine>=5",
  "prune-cli>=0.1.1",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
